# Nginx DEL HOST (no del contenedor) para Hangar en el servidor compartido.
# Copiar a /etc/nginx/conf.d/hangar.conf, cambiar DOMINIO y luego:
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d DOMINIO
# Certbot añade solo el bloque 443 y la redirección desde el 80; no hace falta tocar nada más.

server {
    listen 80;
    server_name DOMINIO;

    # Fotos y PDF que suben los usuarios (la app acepta hasta 20 MB).
    client_max_body_size 25m;

    # IP real del visitante cuando entra a través de Cloudflare (nube naranja). Sin esto la app
    # vería la IP de Cloudflare para todos y el bloqueo de 32 intentos por IP castigaría a todos
    # a la vez. Sólo se confía en la cabecera si la petición viene de verdad de Cloudflare.
    # Rangos oficiales: https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Cabeceras para la app (ProxyFix con 1 proxy). X-Forwarded-For lleva SOLO la IP real:
    # la app toma el último valor de la lista.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 130s;           # Gunicorn corta a los 120 s (Excel grandes)

    # Láminas, modelos 3D (hasta 30 MB), JS y CSS: caché de una semana en el navegador y en
    # Cloudflare. Nginx los recibe rápido de la app y los entrega él al cliente lento.
    location /static_shell/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8082;
    }
}
